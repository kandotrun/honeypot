# Cowrie overrides (mounted over the image default cowrie.cfg;
# only listed keys override). Verify section/key names against the
# image's cowrie.cfg.dist at deploy time.
[honeypot]
hostname = ubuntu
# Cap attacker-triggered downloads (bytes) even though outbound is blocked.
download_limit_size = 10485760
# Keep tty/session logs bounded.
log_rotation = daily

[telnet]
enabled = true

[ssh]
# Inside the container Cowrie listens on 2222/2223; compose maps them
# to the public 22/23.
enabled = true
